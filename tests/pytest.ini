[pytest]
# Este archivo existe para que el rootdir de la suite sea ESTA carpeta y no el
# repositorio padre: el padre tiene su propio [tool.pytest.ini_options] con
# testpaths = ["tests"], que apuntaria a los tests del proyecto grande.
markers =
    slow: necesita audio real (deteccion de beats: ~1.5 min por cancion).

# Los tests con audio real quedan fuera de la ejecucion normal. Para correrlos:
#   python -m pytest ChartScript/tests -m slow
addopts = -m "not slow"
